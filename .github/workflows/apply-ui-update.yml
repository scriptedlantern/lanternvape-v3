name: Validate LanternVape UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate main.lua
        shell: python
        run: |
          from pathlib import Path
          p = Path("main.lua")
          if not p.is_file():
              raise SystemExit("main.lua is missing")
          s = p.read_text(encoding="utf-8")
          required = [
              'Name = "LanternVape"',
              'Version = "2.09"',
              'LOADING LANTERNVAPE..',
              'local SpeedEnabled = false',
              'local Categories = {"Combat","Blatant","External","Rendering","Extra"}',
              'local Mobile = Instance.new("ImageButton")',
              'KeyCode == Enum.KeyCode.LeftShift',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit("main.lua validation failed; missing: " + ", ".join(missing))
          print(f"Validated main.lua ({len(s)} bytes)")
