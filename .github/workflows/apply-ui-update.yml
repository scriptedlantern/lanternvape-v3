name: Apply LanternVape UI Update

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch main.lua
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("main.lua")
          s = p.read_text(encoding="utf-8")
          original = s
          marker = "-- LanternVape asset-backed UI update v2.12"

          if marker not in s:
              anchor = 'local function ButtonIcon(parent,asset,size,pos,z)\n'
              helper = '''local function LoadRemoteAsset(url,name)
              local getter = getcustomasset or getsynasset
              if type(getter) ~= "function" or type(writefile) ~= "function" then
                  return nil
              end
              local okData, data = pcall(function()
                  return game:HttpGet(url)
              end)
              if not okData or type(data) ~= "string" or data == "" then
                  return nil
              end
              local fileName = "LanternVape_"..name
              pcall(function()
                  if type(isfile) ~= "function" or not isfile(fileName) then
                      writefile(fileName, data)
                  end
              end)
              local okAsset, asset = pcall(function()
                  return getter(fileName)
              end)
              return okAsset and asset or nil
          end

          local MobileIconAsset = LoadRemoteAsset(
              "https://raw.githubusercontent.com/scriptedlantern/lanternvape-v3/main/assets/mobile_icon.png",
              "mobile_icon.png"
          )
          local LanternVapeTextAsset = LoadRemoteAsset(
              "https://raw.githubusercontent.com/scriptedlantern/lanternvape-v3/main/assets/lanternvape_text.png",
              "lanternvape_text.png"
          )

          '''
              if anchor not in s:
                  raise SystemExit("Missing ButtonIcon anchor")
              s = s.replace(anchor, helper + anchor, 1)

              old_title = '''local SideTitle = Instance.new("TextLabel")
          SideTitle.Size = UDim2.new(1,-20,0,26)
          SideTitle.Position = UDim2.fromOffset(14,8)
          SideTitle.BackgroundTransparency = 1
          SideTitle.Text = "LanternVape"
          SideTitle.TextColor3 = Config.White
          SideTitle.TextSize = 17
          SideTitle.Font = Enum.Font.GothamBold
          SideTitle.TextXAlignment = Enum.TextXAlignment.Left
          SideTitle.ZIndex = 22
          SideTitle.Parent = SideHeader

          local SideSubtitle = Instance.new("TextLabel")
          SideSubtitle.Size = UDim2.new(1,-20,0,18)
          SideSubtitle.Position = UDim2.fromOffset(14,33)
          SideSubtitle.BackgroundTransparency = 1
          SideSubtitle.Text = "Control Panel"
          SideSubtitle.TextColor3 = Config.Gray
          SideSubtitle.TextSize = 11
          SideSubtitle.Font = Enum.Font.Gotham
          SideSubtitle.ZIndex = 22
          SideSubtitle.Parent = SideHeader
          '''
              new_title = '''local SideTitle = Instance.new("ImageLabel")
          SideTitle.Name = "LanternVapeLogo"
          SideTitle.Size = UDim2.new(1,-20,0,32)
          SideTitle.Position = UDim2.fromOffset(10,7)
          SideTitle.BackgroundTransparency = 1
          SideTitle.Image = LanternVapeTextAsset or ""
          SideTitle.ImageColor3 = Color3.new(1,1,1)
          SideTitle.ScaleType = Enum.ScaleType.Fit
          SideTitle.ZIndex = 22
          SideTitle.Parent = SideHeader
          '''
              if old_title not in s:
                  raise SystemExit("Missing sidebar title block")
              s = s.replace(old_title, new_title, 1)

              for line in [
                  '    SideSubtitle.Text = "Configuration"\n',
                  '    SideSubtitle.Text = "Appearance"\n',
                  '    SideSubtitle.Text = "Control Panel"\n',
              ]:
                  s = s.replace(line, "")

              s = s.replace(
                  'Mobile.Image=Config.Icon\nMobile.ImageColor3=Config.Orange',
                  'Mobile.Image=MobileIconAsset or Config.Icon\nMobile.ImageColor3=Color3.new(1,1,1)'
              )

              s += "\\n\\n" + marker + "\\n"

          s = s.replace('https://raw.githubusercontent.com/scriptedlantern/lanternvape-v3/main/assets/%20mobile_icon.png', 'https://raw.githubusercontent.com/scriptedlantern/lanternvape-v3/main/assets/mobile_icon.png')
          s = s.replace('SideTitle.Text = "Settings"', 'SideTitle.Image = LanternVapeTextAsset or ""')
          s = s.replace('SideTitle.Text = "Themes"', 'SideTitle.Image = LanternVapeTextAsset or ""')
          s = s.replace('SideTitle.Text = "LanternVape"', 'SideTitle.Image = LanternVapeTextAsset or ""')

          p.write_text(s, encoding="utf-8")
          print("main.lua checked", len(s), "bytes")
          PY

      - name: Validate
        run: |
          set -euo pipefail
          test -f "assets/lanternvape_text.png"
          test -f "assets/mobile_icon.png"
          grep -q 'LanternVape asset-backed UI update v2.12' main.lua
          grep -q 'assets/mobile_icon.png' main.lua
          grep -q 'assets/lanternvape_text.png' main.lua
          grep -q 'local MobileIconAsset = LoadRemoteAsset' main.lua
          grep -q 'local LanternVapeTextAsset = LoadRemoteAsset' main.lua
          grep -q 'local SideTitle = Instance.new("ImageLabel")' main.lua
          grep -q 'Mobile.Image=MobileIconAsset or Config.Icon' main.lua
          if grep -q 'SideTitle.Text' main.lua; then
            echo "SideTitle.Text remains after conversion to ImageLabel"
            exit 1
          fi

      - name: Commit main.lua
        run: |
          set -euo pipefail
          if git diff --quiet -- main.lua; then
            echo "main.lua already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.lua
          git commit -m "Use clean LanternVape mobile icon path"
          git push
