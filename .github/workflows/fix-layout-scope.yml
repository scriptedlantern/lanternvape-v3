name: Fix LanternVape UI Scope

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix local function scopes and apply paid banner
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("main.lua")
          s = p.read_text(encoding="utf-8")

          if 'local Layout\n\nlocal function BuildGuiSubSidebar()' not in s:
              marker = 'local function BuildGuiSubSidebar()'
              if marker not in s:
                  raise SystemExit("BuildGuiSubSidebar marker missing")
              s = s.replace(marker, 'local Layout\n\n' + marker, 1)
          s = s.replace('local function Layout()', 'Layout = function()', 1)

          if 'local function BuildSettingsSidebarV2()' not in s and 'function BuildSettingsSidebar()\n    SideMode = "Settings"' in s:
              s = s.replace('function BuildSettingsSidebar()\n    SideMode = "Settings"', 'local function BuildSettingsSidebarV2()\n    SideMode = "Settings"', 1)
          if 'local function BuildThemeSidebarV2()' not in s and 'function BuildThemeSidebar()\n    SideMode = "Themes"' in s:
              s = s.replace('function BuildThemeSidebar()\n    SideMode = "Themes"', 'local function BuildThemeSidebarV2()\n    SideMode = "Themes"', 1)

          s = s.replace('BuildSettingsSidebar(); Utility.Visible=false; Content.Visible=true', 'BuildSettingsSidebarV2(); Utility.Visible=false; Content.Visible=true', 1)
          s = s.replace('BuildThemeSidebar(); Utility.Visible=false; Content.Visible=true', 'BuildThemeSidebarV2(); Utility.Visible=false; Content.Visible=true', 1)

          # Paid-build banner in the unused top-left area.
          banner_marker = 'Scale.Parent = Main\n'
          banner = '''
          -- PAID BUILD BANNER
          local PaidBanner = Instance.new("Frame")
          PaidBanner.Name = "PaidBanner"
          PaidBanner.Size = UDim2.fromOffset(235,44)
          PaidBanner.Position = UDim2.fromOffset(4,4)
          PaidBanner.BackgroundColor3 = Config.Orange
          PaidBanner.BackgroundTransparency = .02
          PaidBanner.BorderSizePixel = 0
          PaidBanner.ZIndex = 10
          PaidBanner.Parent = Main
          Corner(PaidBanner,7)
          Stroke(PaidBanner,Config.Orange,.15,1)

          local PaidGradient = Instance.new("UIGradient")
          PaidGradient.Color = ColorSequence.new({
              ColorSequenceKeypoint.new(0, Color3.fromRGB(220,115,35)),
              ColorSequenceKeypoint.new(.5, Color3.fromRGB(245,150,35)),
              ColorSequenceKeypoint.new(1, Color3.fromRGB(255,205,55))
          })
          PaidGradient.Rotation = 0
          PaidGradient.Parent = PaidBanner

          local PaidText = Instance.new("TextLabel")
          PaidText.Size = UDim2.fromScale(1,1)
          PaidText.BackgroundTransparency = 1
          PaidText.Text = "LANTERNVAPE PAID"
          PaidText.TextColor3 = Color3.new(1,1,1)
          PaidText.TextSize = 17
          PaidText.Font = Enum.Font.GothamBold
          PaidText.TextXAlignment = Enum.TextXAlignment.Center
          PaidText.TextYAlignment = Enum.TextYAlignment.Center
          PaidText.ZIndex = 11
          PaidText.Parent = PaidBanner
          Stroke(PaidText,Color3.fromRGB(70,35,5),.25,1.2)
          '''
          if 'PaidBanner.Name = "PaidBanner"' not in s:
              if banner_marker not in s:
                  raise SystemExit("UIScale marker missing")
              s = s.replace(banner_marker, banner_marker + banner, 1)

          required = [
              'local Layout',
              'Layout = function()',
              'local function BuildSettingsSidebarV2()',
              'local function BuildThemeSidebarV2()',
              'BuildSettingsSidebarV2(); Utility.Visible=false; Content.Visible=true',
              'BuildThemeSidebarV2(); Utility.Visible=false; Content.Visible=true',
              'local PaidBanner = Instance.new("Frame")',
              'PaidText.Text = "LANTERNVAPE PAID"'
          ]
          for item in required:
              if item not in s:
                  raise SystemExit("Missing: " + item)

          p.write_text(s, encoding="utf-8")
          print("LanternVape scope fixes and paid banner applied")
          PY

      - name: Validate
        run: |
          set -euo pipefail
          test -f main.lua
          test -f assets/lanternvape_text.png
          test -f assets/mobile_icon.png
          grep -q 'local Layout' main.lua
          grep -q 'Layout = function()' main.lua
          grep -q 'local function BuildSettingsSidebarV2()' main.lua
          grep -q 'local function BuildThemeSidebarV2()' main.lua
          grep -q 'local profileNames = {"Default"}' main.lua
          grep -q 'PaidText.Text = "LANTERNVAPE PAID"' main.lua
          if grep -q 'local Brand = Instance.new("TextLabel")' main.lua; then exit 1; fi
          if grep -q 'SideTitle.Text' main.lua; then exit 1; fi
          if grep -q 'Control Panel' main.lua; then exit 1; fi

      - name: Commit
        run: |
          set -euo pipefail
          if git diff --quiet -- main.lua; then
            echo "No scope/banner changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.lua
          git commit -m "Add LanternVape paid build banner"
          git push
