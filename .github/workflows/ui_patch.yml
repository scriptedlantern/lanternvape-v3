name: LanternVape UI Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ui-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch main.lua
        shell: python
        run: |
          from pathlib import Path
          p = Path('main.lua')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Name="LanternVape",Version="2.04",', 'Name="LanternVape",Version="2.05",')
          s = s.replace('SettingsIcon="rbxassetid://3599164226",ProfilesIcon="rbxassetid://7074334159",', 'SettingsIcon="rbxassetid://6031280882",ProfilesIcon="rbxthumb://type=AvatarHeadShot&id="..Player.UserId.."&w=48&h=48",')
          s = s.replace('KeybindsIcon="rbxassetid://0",', 'KeybindsIcon="rbxassetid://129697930",')
          s = s.replace('local SettingsPage=Instance.new("Frame") SettingsPage.Size=UDim2.fromScale(1,1)', 'local SettingsPage=Instance.new("Frame") SettingsPage.Size=UDim2.new(1,-36,1,-36) SettingsPage.Position=UDim2.fromOffset(18,18)')
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.lua
          git diff --cached --quiet && exit 0
          git commit -m "LanternVape v2.05 UI icons and panel sizing [ui-patched]"
          git push